<%+header%>
<h2><%:Netlink Tool%></h2>

<div class="cbi-section">
	<h3>Netlink Interface List</h3>
	<div class="cbi-section-descr">
		Shows results of ubus method <code>netlink-tool list_if</code>.
	</div>
	<div class="cbi-value">
		<button type="button" class="cbi-button cbi-button-action" onclick="loadNetlink()">Refresh</button>
	</div>
	<table class="table" id="netlink-table">
		<thead>
			<tr>
				<th>Index</th>
				<th>Interface</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td colspan="2" class="ubus-muted">Click "Refresh" to load.</td>
			</tr>
		</tbody>
	</table>
</div>

<div class="cbi-section">
	<h3>Action Result</h3>
	<div class="cbi-section-descr">
		Shows the latest result of fetch operations.
	</div>
	<pre id="netlink-result" class="ubus-output ubus-output-small">Results will appear after you press a button.</pre>
</div>

<div id="netlink-log" class="cbi-section">
	<h3>Log</h3>
	<ul id="netlink-log-list" class="ubus-log"></ul>
</div>

<style>
	.ubus-output {
		background: #f7f7f7;
		padding: 12px;
		border: 1px solid #ddd;
		min-height: 120px;
		white-space: pre-wrap;
		word-break: break-word;
	}
	.ubus-output-small {
		min-height: 80px;
	}
	.ubus-muted {
		color: #666;
	}
	.ubus-log li {
		margin-bottom: 6px;
	}
	.ubus-log .ok {
		color: #008000;
	}
	.ubus-log .warn {
		color: #aa7a00;
	}
	.ubus-log .err {
		color: #cc0000;
	}
</style>

<script type="text/javascript">
(function() {
	"use strict";

	var apiUrl = '<%=luci.dispatcher.build_url("admin","status","custom-page","api","netlink","call")%>';
	var tableBody = document.getElementById("netlink-table").querySelector("tbody");
	var actionResult = document.getElementById("netlink-result");
	var logList = document.getElementById("netlink-log-list");

	function log(type, message, detail) {
		var li = document.createElement("li");
		li.className = type;
		var text = "[" + (new Date()).toLocaleTimeString() + "] " + message;
		if (detail !== undefined) {
			try {
				text += " :: " + JSON.stringify(detail);
			} catch (e) {
				/* ignore stringify errors */
			}
		}
		li.textContent = text;
		if (logList.firstChild) {
			logList.insertBefore(li, logList.firstChild);
		} else {
			logList.appendChild(li);
		}
	}

	function showResult(title, payload, isError) {
		var header = isError ? "[ERROR] " : "[OK] ";
		var output = header + title;
		if (payload !== undefined) {
			try {
				output += "\n" + JSON.stringify(payload, null, 2);
			} catch (e) {
				output += "\n" + String(payload);
			}
		}
		actionResult.textContent = output;
	}

	function ubusCall(method, args, onSuccess, onFailure) {
		XHR.post(apiUrl, JSON.stringify({ method: method, args: args || {} }), function(xhr, json) {
			if (xhr.status >= 200 && xhr.status < 300 && json && json.ok) {
				onSuccess(json.result || {});
			} else {
				var msg = (json && json.message) ? json.message : ("HTTP " + xhr.status);
				if (onFailure) {
					onFailure(msg);
				}
			}
		}, {
			headers: { "Content-Type": "application/json" }
		});
	}

	window.loadNetlink = function() {
		ubusCall("list_if", {}, function(result) {
			tableBody.innerHTML = "";
			var rows = [];

			if (typeof result === "object" && result !== null) {
				Object.keys(result).sort().forEach(function(key) {
					var entry = result[key];
					if (entry && typeof entry === "object") {
						rows.push(entry);
					}
				});
			}

			rows.forEach(function(entry) {
				var tr = document.createElement("tr");
				var tdIndex = document.createElement("td");
				tdIndex.textContent = entry.index !== undefined ? entry.index : "-";
				tr.appendChild(tdIndex);

				var tdIf = document.createElement("td");
				tdIf.textContent = entry.ifname || "";
				tr.appendChild(tdIf);

				tableBody.appendChild(tr);
			});

			if (rows.length === 0) {
				var tr = document.createElement("tr");
				var td = document.createElement("td");
				td.colSpan = 2;
				td.textContent = "No interfaces found.";
				td.className = "ubus-muted";
				tr.appendChild(td);
				tableBody.appendChild(tr);
			}

			log("ok", "Netlink interface list updated.", rows);
			showResult("list_if", rows, false);
		}, function(err) {
			log("err", "Failed to retrieve netlink interface list.", { error: err });
			showResult("list_if", { error: err }, true);
		});
	};
})();
</script>
<%+footer%>
